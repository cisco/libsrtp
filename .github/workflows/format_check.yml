name: Code Formatting Check

on:
  push:
    branches: [ 2_x_dev, '2_*_x_throttle' ]
  pull_request:
    branches: [ 2_x_dev, '2_*_x_throttle' ]

jobs:
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2
      - name: Install Clang Format
        run: sudo apt install clang-format-14
      - name: Run clang format
        run: ./format.sh -d
